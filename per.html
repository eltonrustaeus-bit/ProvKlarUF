<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SB_URL = 'https://mnmotdluigzeehdjbhbu.supabase.co';
const SB_KEY = 'sb_publishable_T541A0HFXsw0zQRAhIy0kA_x0hcsfVN';
const db = window.supabase.createClient(SB_URL, SB_KEY);

window.addEventListener('load', () => setTimeout(() => document.getElementById('ldr').classList.add('out'), 160));

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* Måste vara samma sträng som TOO_FEW i api/_per-pulse.js. Servern skickar
   den som ett värde där en siffra annars hade stått. */
const TOO_FEW = 'för få elever än';

/* WebAuthn talar ArrayBuffer, JSON talar base64url. De här två gör
   översättningen. Skrivna för hand med flit: alternativet är ett andra
   CDN-beroende för trettio rader kod, och PublicKeyCredential.toJSON() finns
   inte i alla webbläsare Elton kan råka använda. */
const b64urlTillBuf = s => {
  const b = atob(String(s).replace(/-/g, '+').replace(/_/g, '/'));
  const u = new Uint8Array(b.length);
  for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i);
  return u.buffer;
};
const bufTillB64url = b => {
  const u = new Uint8Array(b);
  let t = '';
  for (let i = 0; i < u.length; i++) t += String.fromCharCode(u[i]);
  return btoa(t).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
};

/* Step-up-token lever i sessionStorage, inte localStorage: den ska dö när
   fliken stängs. Servern verifierar den ändå — det här är bekvämlighet, inte
   skydd. */
const STEPUP_NYCKEL = 'exgen_per_stepup';
const hamtaStepUp = () => sessionStorage.getItem(STEPUP_NYCKEL) || '';
const sparaStepUp = t => sessionStorage.setItem(STEPUP_NYCKEL, t);

async function anropa(action, extra) {
  const { data: { session } } = await db.auth.getSession();
  if (!session) return null;
  const res = await fetch('/api/admin', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${session.access_token}` },
    body: JSON.stringify(Object.assign({ action, stepUp: hamtaStepUp() }, extra || {})),
  });
  const json = await res.json().catch(() => null);
  return json ? Object.assign({ _status: res.status }, json) : null;
}

function ritaPost(p) {
  return `<div class="post">
    <p class="postNamn">${esc(p.namn)}</p>
    <p class="postFil">${esc(p.fil || p.nyckel)}</p>
    <p class="postFalt"><b>Gör:</b> ${esc(p['gör'])}</p>
    <p class="postFalt"><b>Ser:</b> ${esc(p.ser)}</p>
    <p class="postFalt postGrans"><b>Gräns:</b> ${esc(p['gräns'])}</p>
  </div>`;
}

/* Ett värde som inte är ett tal ritas som text i mindre stil. Att rendera
   "för få elever än" som en stor siffra vore att låtsas att den är mätt —
   och att rendera den som 0 vore att påstå ett mätvärde som inte finns. */
function ritaStat(etikett, varde, accent) {
  const tunt = typeof varde !== 'number';
  return `<div class="statBox">
    <div class="statLabel">${esc(etikett)}</div>
    <div class="statVal ${tunt ? 'tunt' : (accent ? 'accent' : '')}">${esc(varde)}</div>
  </div>`;
}

function ritaPuls(d) {

  document.getElementById('pulsTid').textContent =
    'hämtad ' + new Date(d['hämtad']).toLocaleString('sv-SE');

  const kvot = d.cacheBeslut['träffkvot'];
  document.getElementById('pulsen').innerHTML = [
    ritaStat('Långtidsminnen', d.minnen.totalt),
    ritaStat('Varav färska', d.minnen['färska'], true),
    ritaStat('Passerat 90 dygn', d.minnen.gamla),
    ritaStat('Cachens träffkvot', typeof kvot === 'number' ? kvot + ' %' : kvot, true),
    ritaStat('Sonderingar 7 dygn', d.cacheBeslut.totalt),
    ritaStat('Cacherader godkända', d.cacheRader.approved),
    ritaStat('Cacherader väntande', d.cacheRader.pending),
    ritaStat('Cacherader utgångna', d.cacheRader['utgångna']),
    ...d.kvoter.map(k => ritaStat('Kvot ' + k.funktion, k['använt'])),
  ].join('');

  document.getElementById('begreppen').innerHTML = (d.begrepp === TOO_FEW)
    ? `<div class="post"><p class="postNamn">Svåraste begreppen</p><p class="postFalt">${esc(TOO_FEW)} — vyn concept_collective_stats visar ett begrepp först vid fem distinkta elever, en felkod vid tre.</p></div>`
    : d.begrepp.map(b => `<div class="post">
        <p class="postNamn">${esc(b.namn)}</p>
        <p class="postFil">${esc(b.elever)} elever · medelpoäng ${esc(b['medelpoäng'])}</p>
        <p class="postFalt">${b.felkoder.length ? 'Vanligaste fel: ' + esc(b.felkoder.join(', ')) : 'Inga felkoder över tröskeln.'}</p>
      </div>`).join('');
}

function ritaEnheter(enheter) {
  document.getElementById('enheter').innerHTML = (enheter || []).map(e => `<div class="post">
    <div class="enhetRad">
      <div>
        <p class="postNamn">${esc(e.label)}</p>
        <p class="postFil">registrerad ${new Date(e.created_at).toLocaleString('sv-SE')}${e.last_used_at ? ' · senast använd ' + new Date(e.last_used_at).toLocaleString('sv-SE') : ' · aldrig använd'}</p>
      </div>
      <button class="taBort" data-id="${esc(e.credential_id)}">Ta bort</button>
    </div>
  </div>`).join('');
  document.querySelectorAll('.taBort').forEach(b => b.addEventListener('click', async () => {
    await anropa('passkey-delete', { credentialId: b.dataset.id });
    await ladda();
  }));
}

function enhetsNamn() {
  const pf = navigator.platform || '';
  return (/iPhone|iPad/.test(pf) ? 'iPhone/iPad' : /Mac/.test(pf) ? 'Mac' : 'Enhet') +
    ' · ' + new Date().toLocaleDateString('sv-SE');
}

function visaFel(r) {
  const t = document.getElementById('lasText');
  if (r && r.error === 'stepup_unconfigured') {
    t.textContent = 'PASSKEY_STEPUP_SECRET är inte satt i Vercel. Låset kan inte utfärda något bevis förrän den finns — det är avsiktligt, inte ett fel att kringgå.';
    return;
  }
  t.textContent = 'Det gick inte: ' + ((r && r.error) || 'inget svar från servern') + '.';
}

async function registrera() {
  const r = await anropa('passkey-register-begin');
  if (!r || !r.ok) return visaFel(r);
  const o = r.options;
  const cred = await navigator.credentials.create({ publicKey: Object.assign({}, o, {
    challenge: b64urlTillBuf(o.challenge),
    user: Object.assign({}, o.user, { id: b64urlTillBuf(o.user.id) }),
    excludeCredentials: (o.excludeCredentials || []).map(c => Object.assign({}, c, { id: b64urlTillBuf(c.id) })),
  }) });
  const svar = {
    id: cred.id, rawId: bufTillB64url(cred.rawId), type: cred.type,
    clientExtensionResults: cred.getClientExtensionResults(),
    response: {
      clientDataJSON: bufTillB64url(cred.response.clientDataJSON),
      attestationObject: bufTillB64url(cred.response.attestationObject),
      transports: cred.response.getTransports ? cred.response.getTransports() : [],
    },
  };
  const f = await anropa('passkey-register-finish', { response: svar, label: enhetsNamn() });
  if (!f || !f.ok) return visaFel(f);
  sparaStepUp(f.stepUp);
  await ladda();
}

async function lasUpp() {
  const r = await anropa('passkey-auth-begin');
  if (!r || !r.ok) return visaFel(r);
  const o = r.options;
  const cred = await navigator.credentials.get({ publicKey: Object.assign({}, o, {
    challenge: b64urlTillBuf(o.challenge),
    allowCredentials: (o.allowCredentials || []).map(c => Object.assign({}, c, { id: b64urlTillBuf(c.id) })),
  }) });
  const svar = {
    id: cred.id, rawId: bufTillB64url(cred.rawId), type: cred.type,
    clientExtensionResults: cred.getClientExtensionResults(),
    response: {
      clientDataJSON: bufTillB64url(cred.response.clientDataJSON),
      authenticatorData: bufTillB64url(cred.response.authenticatorData),
      signature: bufTillB64url(cred.response.signature),
      userHandle: cred.response.userHandle ? bufTillB64url(cred.response.userHandle) : undefined,
    },
  };
  const f = await anropa('passkey-auth-finish', { response: svar });
  if (!f || !f.ok) return visaFel(f);
  sparaStepUp(f.stepUp);
  await ladda();
}

/* Återställningskoden. Visas EN gång — servern sparar bara ett scrypt-hash och
   kan aldrig visa den igen. Utan den betyder två borttappade enheter att någon
   måste gå in i databasen för hand. */
async function skapaKod() {
  const ruta = document.getElementById('kodRuta');
  if (!confirm('Detta ersätter en eventuell tidigare kod. Den nya visas en enda gång — har du din lösenordshanterare öppen?')) return;
  const r = await anropa('recovery-create');
  if (!r || !r.ok) return visaFel(r);
  ruta.style.display = '';
  ruta.textContent = 'Spara den här nu, den visas aldrig igen: ' + r.kod;
}

/* ── HJÄRNAN ────────────────────────────────────────────────────────────────
 *
 * Kraftsimulering i canvas. Handskriven med flit: d3-force + d3-selection är
 * ~280 kB för något som ryms här, och repot har inget byggsteg. Samma avvägning
 * som KaTeX, fast tvärtom — där var biblioteket värt det.
 *
 * SIMULERINGEN STANNAR när grafen är stilla. En requestAnimationFrame som
 * snurrar i evighet på en sida som lämnas öppen är en varm telefon och ingen
 * information. Den startar om vid interaktion och vid ny data.
 */
const NOD_FARG = { modul: '#1bff8c', 'hjälpare': '#7fd4ff', flagga: '#ffcf6b', rutt: '#c9a6ff' };
const STILLA = 0.06;   // total rörelse under detta = klart

let hjarnaLoop = null;

function ritaHjarnan(brain) {
  const canvas = document.getElementById('hjarna');
  const info = document.getElementById('nodInfo');
  const ctx2 = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;

  function storlek() {
    const r = canvas.getBoundingClientRect();
    canvas.width = Math.max(1, Math.round(r.width * dpr));
    canvas.height = Math.max(1, Math.round(r.height * dpr));
    ctx2.setTransform(dpr, 0, 0, dpr, 0, 0);
    return { w: r.width, h: r.height };
  }
  let { w, h } = storlek();

  const grader = {};
  for (const k of brain.kanter) {
    grader[k['från']] = (grader[k['från']] || 0) + 1;
    grader[k.till] = (grader[k.till] || 0) + 1;
  }

  /* Startpositionerna är deterministiska, inte slumpade: en karta som ser helt
     annorlunda ut vid varje omladdning går inte att känna igen, och då tappar
     man det enda en karta är bra på — att man minns var saker låg. */
  const noder = brain.noder.map((n, i) => {
    const vinkel = (i / brain.noder.length) * Math.PI * 2;
    return {
      ...n,
      grad: grader[n.id] || 0,
      x: w / 2 + Math.cos(vinkel) * Math.min(w, h) * 0.34,
      y: h / 2 + Math.sin(vinkel) * Math.min(w, h) * 0.34,
      vx: 0, vy: 0,
    };
  });
  const index = new Map(noder.map(n => [n.id, n]));
  const kanter = brain.kanter
    .map(k => ({ a: index.get(k['från']), b: index.get(k.till) }))
    .filter(k => k.a && k.b);

  const radie = n => 5 + Math.min(9, n.grad * 1.1);

  function steg() {
    let rörelse = 0;
    // Repulsion.
    for (let i = 0; i < noder.length; i++) {
      for (let j = i + 1; j < noder.length; j++) {
        const a = noder[i], b = noder[j];
        let dx = b.x - a.x, dy = b.y - a.y;
        let d2 = dx * dx + dy * dy;
        if (d2 < 1) { d2 = 1; dx = (i - j) || 1; dy = 1; }
        const kraft = 2600 / d2;
        const d = Math.sqrt(d2);
        const fx = (dx / d) * kraft, fy = (dy / d) * kraft;
        a.vx -= fx; a.vy -= fy; b.vx += fx; b.vy += fy;
      }
    }
    // Fjädrar.
    for (const k of kanter) {
      const dx = k.b.x - k.a.x, dy = k.b.y - k.a.y;
      const d = Math.sqrt(dx * dx + dy * dy) || 1;
      const kraft = (d - 90) * 0.012;
      const fx = (dx / d) * kraft, fy = (dy / d) * kraft;
      k.a.vx += fx; k.a.vy += fy; k.b.vx -= fx; k.b.vy -= fy;
    }
    // Mot mitten + dämpning.
    for (const n of noder) {
      n.vx += (w / 2 - n.x) * 0.0016;
      n.vy += (h / 2 - n.y) * 0.0016;
      n.vx *= 0.86; n.vy *= 0.86;
      n.x += n.vx; n.y += n.vy;
      const r = radie(n) + 2;
      n.x = Math.max(r, Math.min(w - r, n.x));
      n.y = Math.max(r, Math.min(h - r, n.y));
      rörelse += Math.abs(n.vx) + Math.abs(n.vy);
    }
    return rörelse / Math.max(1, noder.length);
  }

  function rita() {
    ctx2.clearRect(0, 0, w, h);
    ctx2.lineWidth = 1;
    for (const k of kanter) {
      ctx2.strokeStyle = 'rgba(168,196,180,0.14)';
      ctx2.beginPath(); ctx2.moveTo(k.a.x, k.a.y); ctx2.lineTo(k.b.x, k.b.y); ctx2.stroke();
    }
    for (const n of noder) {
      const grund = NOD_FARG[n.typ] || '#a8c4b4';
      /* aktivitet === null betyder INGEN MÄTPUNKT, inte noll aktivitet.
         Skillnaden ritas ut: dämpad kontur i stället för fylld nod. */
      const omätt = n.aktivitet === null || n.aktivitet === undefined;
      const ljus = omätt ? 0 : n.aktivitet;
      ctx2.beginPath();
      ctx2.arc(n.x, n.y, radie(n), 0, Math.PI * 2);
      if (omätt) {
        ctx2.strokeStyle = grund; ctx2.globalAlpha = 0.28; ctx2.stroke(); ctx2.globalAlpha = 1;
      } else {
        ctx2.fillStyle = grund; ctx2.globalAlpha = 0.35 + ljus * 0.65; ctx2.fill(); ctx2.globalAlpha = 1;
        if (ljus > 0.05) {
          ctx2.beginPath();
          ctx2.arc(n.x, n.y, radie(n) + 4 + ljus * 6, 0, Math.PI * 2);
          ctx2.strokeStyle = grund; ctx2.globalAlpha = ljus * 0.5; ctx2.stroke(); ctx2.globalAlpha = 1;
        }
      }
      if (n.grad >= 3 || !omätt) {
        ctx2.fillStyle = 'rgba(232,245,238,0.72)';
        ctx2.font = '10px ui-monospace, monospace';
        ctx2.fillText(n.etikett.replace(/\.js$/, ''), n.x + radie(n) + 4, n.y + 3);
      }
    }
  }

  function loop() {
    const rörelse = steg();
    rita();
    // Stannar när grafen lagt sig. Se noten ovan.
    if (rörelse > STILLA) hjarnaLoop = requestAnimationFrame(loop);
    else hjarnaLoop = null;
  }

  function starta() {
    if (hjarnaLoop) cancelAnimationFrame(hjarnaLoop);
    hjarnaLoop = requestAnimationFrame(loop);
  }

  canvas.onclick = e => {
    const r = canvas.getBoundingClientRect();
    const mx = e.clientX - r.left, my = e.clientY - r.top;
    const träff = noder.find(n => Math.hypot(n.x - mx, n.y - my) <= radie(n) + 6);
    if (!träff) { info.style.display = 'none'; return; }
    const post = (SENASTE_REGISTER.moduler || []).concat(SENASTE_REGISTER.flaggor || [])
      .find(x => (x.fil && x.fil.replace(/^_|\.js$/g, '') === träff.id) || ('flagga:' + x.nyckel) === träff.id);
    const mätt = träff.aktivitet === null || träff.aktivitet === undefined
      ? 'Ingen m\u00e4tpunkt \u2014 den h\u00e4r delen f\u00e4ster inget block i systemprompten, s\u00e5 den g\u00e5r inte att m\u00e4ta d\u00e4r. Ingen gissning ritas i st\u00e4llet.'
      : `Senaste timmen: ${träff.senasteTimmen} anv\u00e4ndningar. Ljus ${Math.round(träff.aktivitet * 100)}% mot eget dygnsmedel.`;
    info.style.display = '';
    info.innerHTML = `<p class="postNamn">${esc(post ? post.namn : träff.etikett)}</p>
      <p class="postFil">${esc(träff.etikett)} \u00b7 ${esc(träff.typ)} \u00b7 ${träff.grad} kanter</p>
      ${post ? `<p class="postFalt"><b>G\u00f6r:</b> ${esc(post['g\u00f6r'])}</p>
      <p class="postFalt postGrans"><b>Gr\u00e4ns:</b> ${esc(post['gr\u00e4ns'])}</p>` : ''}
      <p class="postFalt">${esc(mätt)}</p>`;
  };

  window.addEventListener('resize', () => { ({ w, h } = storlek()); starta(); });

  document.getElementById('hjarnaSub').textContent =
    `${noder.length} noder, ${kanter.length} kanter \u2014 strukturen l\u00e4st ur api/ vid anropet`;
  starta();
}

/* Registret sparas när det hämtas, så ett klick i grafen kan visa posten utan
   ett nytt anrop. Grafen och registret är samma data sedd på två sätt. */
let SENASTE_REGISTER = {};

async function ladda() {
  const st = await anropa('passkey-status');
  /* Servern svarar likadant på "du är inte ägaren" som på en action som inte
     finns. Sidan kan alltså inte skilja dem åt — och ska inte kunna det.
     Båda ger 404-vyn. Ett felmeddelande här hade bekräftat att sidan finns. */
  if (!st || !st.ok) return;

  /* Först HÄR byggs sidan. Fram till nu innehöll dokumentet bara 404-vyn,
     så en titt i källkoden gav inget att gå på. */
  document.getElementById('intetSkarm').style.display = 'none';
  document.getElementById('privat').innerHTML = `
    <div class="pageHero" id="hero">
      <div class="eyebrow">Privat</div>
      <h1 class="pageTitle">P.E.R:s minne</h1>
      <p class="pageSub" id="status">Kontrollerar\u2026</p>
    </div>

    <div id="lasSkarm" class="post" style="margin-bottom:32px">
      <p class="postNamn">Sidan \u00e4r l\u00e5st</p>
      <p class="postFalt" id="lasText">Kontrollerar\u2026</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">
        <button class="btn" id="lasUppBtn" style="display:none">L\u00e5s upp med Face ID / Touch ID</button>
        <button class="btn" id="registreraBtn" style="display:none">Registrera den h\u00e4r enheten</button>
        <button class="btn" id="kodBtn" style="display:none">Skapa \u00e5terst\u00e4llningskod</button>
      </div>
      <p class="postFalt" id="kodRuta" style="display:none;font-family:var(--mono);word-break:break-all"></p>
    </div>

    <div id="enheter" class="rutnat" style="margin-bottom:32px"></div>

    <section class="sekt" id="sektRegistret" style="display:none">
      <h2 class="sektRubrik">Registret</h2>
      <p class="sektSub">vad P.E.R. \u00e4r \u2014 moduler och flaggor</p>
      <div class="rutnat" id="registret"></div>
    </section>

    <section class="sekt" id="sektHjarnan" style="display:none">
      <h2 class="sektRubrik">Hj\u00e4rnan</h2>
      <p class="sektSub" id="hjarnaSub">strukturen l\u00e4st ur koden, ljuset m\u00e4tt</p>
      <div id="hjarnaWrap">
        <canvas id="hjarna"></canvas>
        <div id="nodInfo"></div>
      </div>
      <div id="hjarnaLegend">
        <span><b style="background:#1bff8c"></b>modul</span>
        <span><b style="background:#7fd4ff"></b>hj\u00e4lpare</span>
        <span><b style="background:#ffcf6b"></b>flagga</span>
        <span><b style="background:#c9a6ff"></b>rutt</span>
        <span>ljus = ovanligt aktiv senaste timmen \u00b7 d\u00e4mpad = ingen m\u00e4tpunkt</span>
      </div>
    </section>

    <section class="sekt" id="sektPulsen" style="display:none">
      <h2 class="sektRubrik">Pulsen</h2>
      <p class="sektSub" id="pulsTid">vad han g\u00f6r just nu</p>
      <div class="statsRow" id="pulsen"></div>
      <div class="rutnat" id="begreppen"></div>
    </section>

    <footer style="margin-top:40px">ExGen \u2014 privat sida, ej f\u00f6r obeh\u00f6riga.</footer>`;

  document.getElementById('lasUppBtn').addEventListener('click', lasUpp);
  document.getElementById('registreraBtn').addEventListener('click', registrera);
  document.getElementById('kodBtn').addEventListener('click', skapaKod);
  ritaEnheter(st.enheter);

  const status = document.getElementById('status');
  const lasText = document.getElementById('lasText');
  const lasSkarm = document.getElementById('lasSkarm');
  const lasUppBtn = document.getElementById('lasUppBtn');
  const registreraBtn = document.getElementById('registreraBtn');
  document.getElementById('kodBtn').style.display = '';

  if (!st.konfigurerad) { visaFel({ error: 'stepup_unconfigured' }); return; }

  const har = (st.enheter || []).length > 0;
  lasUppBtn.style.display = har ? '' : 'none';
  registreraBtn.style.display = '';
  lasText.textContent = har
    ? 'Registret och pulsen visas när du bekräftat med Face ID eller Touch ID.'
    : 'Ingen enhet är registrerad än. Registrera den här enheten för att låsa upp sidan.';

  const reg = await anropa('per-registry');
  if (!reg || !reg.ok) return;

  /* Först här är sidan upplåst. Data har inte legat i en dold div — servern
     vägrade svara tills step-up var på plats. */
  lasSkarm.style.display = 'none';
  document.getElementById('sektRegistret').style.display = '';
  document.getElementById('sektPulsen').style.display = '';
  document.getElementById('sektHjarnan').style.display = '';
  status.textContent = 'Registret beskrivs i api/_per-registry.js och bevakas av tests/per/per-registry.test.mjs, som faller om en modul saknar post eller en post saknar modul.';
  SENASTE_REGISTER = reg.registry;
  document.getElementById('registret').innerHTML =
    [...reg.registry.moduler, ...reg.registry.flaggor].map(ritaPost).join('');

  const p = await anropa('per-pulse');
  if (!p || !p.ok) return;
  ritaPuls(p.pulse);

  const h = await anropa('per-brain');
  if (h && h.ok) ritaHjarnan(h.brain);
  else document.getElementById('hjarnaSub').textContent =
    'kartan kunde inte l\u00e4sas: ' + ((h && h.error) || 'inget svar');
}

/* Lyssnarna kopplas i ladda(), efter att markupen byggts — knapparna finns
   inte i dokumentet innan dess. */
ladda();
</script>
</body>
</html>
