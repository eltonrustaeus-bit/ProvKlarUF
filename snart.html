<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ExGen — snart tillbaka</title>
<meta name="description" content="ExGen bygger om. Vi är tillbaka inom kort." />
<meta name="robots" content="noindex" />
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="icon" href="/image/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/image/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<!-- Formtokens: radie, avstånd, typsnitt, rörelse. Enbart :root-variabler. -->
<link rel="stylesheet" href="exgen-tokens.css" />
<style>
  :root{
    --a:#00768F; --teal:#00B7D9; --mint:#76D76A;
    --t:#1B2430; --t2:#4A5567; --t3:#667085;
    --bg:#F7F9FB; --s:#ffffff; --l:#E4E7EC;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--t);
    font-family:'DM Sans',-apple-system,BlinkMacSystemFont,sans-serif;
    -webkit-font-smoothing:antialiased; display:grid; place-items:center; padding:24px;
    position:relative; overflow:hidden;
  }
  /* Samma rutnät och glöd som introskärmen, så sidan känns som ExGen och inte som ett driftfel */
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
    background-image:
      linear-gradient(rgba(0,183,217,.06) 1px,transparent 1px),
      linear-gradient(90deg,rgba(0,183,217,.06) 1px,transparent 1px);
    background-size:56px 56px;
    -webkit-mask-image:radial-gradient(ellipse 70% 70% at 50% 45%,#000,transparent);
    mask-image:radial-gradient(ellipse 70% 70% at 50% 45%,#000,transparent);
  }
  .orb{
    position:fixed; width:520px; height:520px; top:50%; left:50%;
    margin:-260px 0 0 -260px; pointer-events:none; z-index:0;
    background:radial-gradient(circle,rgba(0,183,217,.14) 0%,transparent 65%);
    filter:blur(60px); animation:drift 9s ease-in-out infinite;
  }
  @keyframes drift{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-16px) scale(1.05)}}

  .card{position:relative; z-index:1; width:min(520px,100%); text-align:center}
  .logo{height:34px; width:auto; display:block; margin:0 auto 28px}
  .eyebrow{
    font-family:'DM Mono',monospace; font-size:10px; letter-spacing:.18em;
    text-transform:uppercase; color:var(--a); margin-bottom:14px;
  }
  h1{
    font-size:clamp(30px,6vw,42px); font-weight:700; letter-spacing:-.035em;
    line-height:1.12; margin:0 0 18px;
  }
  .lead{font-size:16.5px; line-height:1.7; color:var(--t2); margin:0 0 14px}
  .sub{font-size:15px; line-height:1.7; color:var(--t3); margin:0}
  .rule{
    width:60px; height:1px; margin:32px auto;
    background:linear-gradient(90deg,transparent,rgba(0,183,217,.45),transparent);
  }
  .dots{display:flex; gap:7px; justify-content:center; margin-bottom:22px}
  .dot{width:5px; height:5px; border-radius:50%; background:rgba(0,183,217,.35); animation:pulse 1.6s ease-in-out infinite}
  .dot:nth-child(2){animation-delay:.28s}
  .dot:nth-child(3){animation-delay:.56s}
  @keyframes pulse{0%,100%{opacity:.3;transform:scale(1)}50%{opacity:1;transform:scale(1.5)}}
  .foot{font-family:'DM Mono',monospace; font-size:10.5px; color:var(--t3); letter-spacing:.02em; line-height:1.7}
  .foot a{color:var(--t3)}
  .foot a:hover{color:var(--a)}

  /* ── Kodinsläpp ────────────────────────────────────────────────────────
     Diskret punkt i hörnet. Den ska vara lätt att hitta för den som vet att
     den finns och lätt att förbise för alla andra — därför ingen text och
     ingen ram förrän man rör vid den. Träffytan är 44x44 så att den går att
     träffa med tummen på en telefon, trots att pricken bara är 8px. */
  .keyDot{position:fixed; right:14px; bottom:14px; width:44px; height:44px;
    display:grid; place-items:center; border:0; background:none; cursor:pointer;
    padding:0; z-index:20; -webkit-tap-highlight-color:transparent}
  .keyDot::before{content:""; width:8px; height:8px; border-radius:50%;
    background:var(--t3); opacity:.32; transition:opacity .18s, transform .18s}
  .keyDot:hover::before,.keyDot:focus-visible::before{opacity:.9; transform:scale(1.25)}
  .keyDot:focus-visible{outline:2px solid var(--a); outline-offset:-8px; border-radius:50%}

  .keyBox{position:fixed; right:14px; bottom:66px; z-index:21; display:none;
    background:var(--s); border:1px solid var(--l); border-radius:var(--exgen-radius-lg);
    padding:14px; box-shadow:0 16px 40px rgba(14,27,42,.16); width:min(232px,calc(100vw - 28px))}
  .keyBox.on{display:block}
  .keyLbl{font-family:'DM Mono',monospace; font-size:9.5px; letter-spacing:.12em;
    text-transform:uppercase; color:var(--t3); display:block; margin-bottom:8px}
  .keyRow{display:flex; gap:7px}
  /* inputmode=numeric ger sifferknappsatsen direkt på mobil */
  .keyIn{flex:1; min-width:0; height:42px; padding:0 12px; border:1px solid var(--l);
    border-radius:var(--exgen-radius-md); font-family:'DM Mono',monospace; font-size:16px; color:var(--t);
    letter-spacing:.16em; outline:none; background:var(--bg); width:100%}
  .keyIn:focus{border-color:var(--a); box-shadow:0 0 0 3px rgba(0,118,143,.10)}
  .keyGo{height:42px; padding:0 15px; border:0; border-radius:var(--exgen-radius-md); background:var(--a);
    color:#fff; font-family:'DM Sans',sans-serif; font-weight:600; font-size:14px; cursor:pointer}
  .keyGo:disabled{opacity:.45; cursor:not-allowed}
  .keyMsg{font-family:'DM Mono',monospace; font-size:10px; color:#B91C1C;
    margin:8px 0 0; min-height:13px; line-height:1.5}

  @media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>

<div class="orb" aria-hidden="true"></div>

<main class="card">
  <img class="logo" src="/image/exgen-logo.png" alt="ExGen" />

  <div class="eyebrow">Snart tillbaka</div>

  <h1>Vi bygger om.</h1>

  <p class="lead">ExGen är stängt en kort stund medan vi gör något betydligt vassare av det.</p>

  <p class="sub">När vi öppnar igen ska du slippa gissa vad du ska plugga på. Det är allt vi säger så länge.</p>

  <div class="rule" aria-hidden="true"></div>

  <div class="dots" aria-hidden="true">
    <span class="dot"></span><span class="dot"></span><span class="dot"></span>
  </div>

  <p class="foot">
    Har du redan ett konto ligger allt kvar orört.<br>
    <a href="/integritetspolicy.html">Integritetspolicy</a>
  </p>
</main>

<!-- Kodinsläpp under ombyggnaden. Tas bort tillsammans med grinden när sajten
     öppnas för alla — se api/_maintenance.js. -->
<button class="keyDot" id="keyDot" type="button" aria-label="Ange kod"
        aria-expanded="false" aria-controls="keyBox"></button>

<div class="keyBox" id="keyBox" role="dialog" aria-label="Ange kod">
  <label class="keyLbl" for="keyIn">Kod</label>
  <div class="keyRow">
    <input class="keyIn" id="keyIn" type="text" inputmode="numeric" autocomplete="off"
           enterkeyhint="go" maxlength="12" placeholder="——————" aria-describedby="keyMsg">
    <button class="keyGo" id="keyGo" type="button">Gå in</button>
  </div>
  <p class="keyMsg" id="keyMsg" role="alert" aria-live="polite"></p>
</div>

<script>
(function () {
  /* Koden jämförs på servern mot ACCESS_CODE (api/check-role.js) och står
     ingenstans i den här filen — repot är publikt. Det som sparas här är bara
     det användaren skrev in; det öppnar ingenting av sig själv, utan skickas
     med vid varje sidladdning och prövas om. */
  var PASS_KEY = "exgen_gate_pass";
  var BACK_KEY = "exgen_gate_back";

  var dot = document.getElementById("keyDot");
  var box = document.getElementById("keyBox");
  var inp = document.getElementById("keyIn");
  var go  = document.getElementById("keyGo");
  var msg = document.getElementById("keyMsg");

  function open(on) {
    box.classList.toggle("on", on);
    dot.setAttribute("aria-expanded", on ? "true" : "false");
    if (on) setTimeout(function () { inp.focus(); }, 40);
  }

  dot.addEventListener("click", function () { open(!box.classList.contains("on")); });

  // Klick utanför stänger. Utan detta blir rutan kvar över sidan på mobil.
  document.addEventListener("click", function (e) {
    if (!box.classList.contains("on")) return;
    if (box.contains(e.target) || dot.contains(e.target)) return;
    open(false);
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && box.classList.contains("on")) open(false);
  });

  function submit() {
    var code = (inp.value || "").trim();
    if (!code) { inp.focus(); return; }
    go.disabled = true;
    msg.textContent = "";

    fetch("/api/check-role", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "maintenance_gate", code: code })
    }).then(function (r) {
      // 401 betyder "ingen giltig inloggning" — med fel kod är det samma sak
      // som fel kod, så behandla det som ett nej i stället för som ett fel.
      if (r.status === 401) return { allow: false };
      if (!r.ok) throw new Error("http " + r.status);
      return r.json();
    }).then(function (d) {
      if (!d || d.allow !== true) {
        go.disabled = false;
        msg.textContent = "Fel kod.";
        inp.select();
        return;
      }
      try { localStorage.setItem(PASS_KEY, code); } catch (_) {}
      var back = "/";
      try { back = localStorage.getItem(BACK_KEY) || "/"; localStorage.removeItem(BACK_KEY); } catch (_) {}
      // Aldrig tillbaka hit — det hade blivit en loop.
      if (/snart\.html/i.test(back)) back = "/";
      location.replace(back);
    }).catch(function () {
      go.disabled = false;
      msg.textContent = "Ingen kontakt. Försök igen.";
    });
  }

  go.addEventListener("click", submit);
  inp.addEventListener("keydown", function (e) { if (e.key === "Enter") submit(); });
  inp.addEventListener("input", function () { msg.textContent = ""; });
})();
</script>

</body>
</html>
